# Staging environment — isolated database, separate port, no public exposure.
# IMPORTANT: uses its own compose project (sanad-staging) so it never replaces
# the production containers, which live in the default "sanad" project.
name: sanad-staging
# Usage:
#   cp .env.staging.example .env.staging
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#   docker compose -f docker-compose.staging.yml --env-file .env.staging exec app npx prisma migrate deploy
services:
  db:
    image: postgres:16-bookworm
    container_name: sanad-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanad_staging}
      POSTGRES_USER: ${POSTGRES_USER:-sanad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.staging}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: sanad-app:latest
    container_name: sanad-staging-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sanad_staging}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env.staging}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3101}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?set in .env.staging}
      DOCUMENT_SIGNATURE_KEY: ${DOCUMENT_SIGNATURE_KEY:-${FILE_ENCRYPTION_KEY}}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3101:3001"
    volumes:
      - staging-uploads:/app/uploads
      - staging-backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  staging-postgres:
  staging-uploads:
  staging-backups:
