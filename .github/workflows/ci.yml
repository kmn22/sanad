name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: sanad_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sanad_test?schema=public"
      NEXTAUTH_SECRET: "ci-secret-key-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit & Integration tests
        run: npm test

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: sanad_e2e
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: e2e-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: "postgresql://sanad:e2e-postgres-password@localhost:5432/sanad_e2e?schema=public"
      NEXTAUTH_SECRET: "e2e-secret-key-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3101"
      FILE_ENCRYPTION_KEY: "e2e-file-encryption-key-at-least-32-chars"
      SKIP_ENV_VALIDATION: "true"
      PORT: "3101"
      HOSTNAME: "127.0.0.1"
      E2E_BASE_URL: "http://127.0.0.1:3101"
      E2E_OWNER_EMAIL: "e2e.owner@sanad.test"
      E2E_OWNER_PASSWORD: "Sanad-E2E-Passw0rd!"
      E2E_LAWYER_EMAIL: "e2e.lawyer@sanad.test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed E2E fixtures
        run: npx tsx scripts/seed_e2e.ts

      - name: Build the app
        run: npm run build

      - name: Start the production server
        run: nohup npm start > server.log 2>&1 &

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3101/api/health && exit 0
            sleep 2
          done
          echo "server failed to become healthy"; cat server.log; exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npx playwright test

      - name: Upload browser traces and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            server.log
            test-results/
          retention-days: 7
