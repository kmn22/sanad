services:
  db:
    image: postgres:16-bookworm
    container_name: sanad-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: sanad
      POSTGRES_USER: sanad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - sanad-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad -d sanad"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: sanad-uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - sanad-uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanad-app:latest
    container_name: sanad-web
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://sanad:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/sanad
      - NEXTAUTH_URL=https://sanad.tail963524.ts.net
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-coder:30b}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY must be set}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY:-${BACKUP_ENCRYPTION_KEY}}
      - DOCUMENT_SIGNATURE_KEY=${DOCUMENT_SIGNATURE_KEY:-${FILE_ENCRYPTION_KEY:-${BACKUP_ENCRYPTION_KEY}}}
      - UPLOAD_ROOT=/app/uploads
      - CRON_SECRET=${CRON_SECRET:-}
      - NAJIZ_WEBHOOK_SECRET=${NAJIZ_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Tailscale Funnel: exposes https://sanad.tail963524.ts.net -> http://app:3001
  # IMPORTANT: ./ts-state holds the node identity + auth credentials + funnel
  # config. Never delete it — deleting it forces interactive re-auth.
  # Set TS_AUTHKEY (reusable, tagged auth key from the admin console) so the
  # node can re-register automatically if the state is ever lost.
  ts-sanad:
    image: tailscale/tailscale:latest
    container_name: sanad-ts
    hostname: sanad
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --hostname=sanad
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  sanad-postgres-data:
  sanad-uptime-kuma-data:
