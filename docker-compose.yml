services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanad-app:latest
    container_name: sanad-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/db/custom.db
      - NEXTAUTH_URL=https://sanad.tail963524.ts.net
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./prisma/db:/app/db
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
